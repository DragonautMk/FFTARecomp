name: FFTA portable Linux
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      - name: Tests
        run: cargo test --locked --release -p installer -p input-config -p recomp --lib --bins -- --test-threads=1
      - name: Package
        run: bash scripts/linux/package_ffta_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FFTARecomp-linux-portable
          path: dist/FFTARecomp-linux-portable.tar.gz
          if-no-files-found: error

