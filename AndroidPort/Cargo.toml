[workspace]
resolver = "2"
members = ["crates/armv4t", "crates/gba-core", "crates/recomp-core", "crates/gba-android"]
default-members = ["crates/gba-android"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
debug = false
strip = true
lto = "thin"
codegen-units = 16
