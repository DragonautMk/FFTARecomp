[package]
name = "gba-android"
version = "0.1.0"
edition = "2021"

[lib]
name = "gba_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
gba-core = { path = "../gba-core", features = ["parallel-ppu"] }
armv4t = { path = "../armv4t" }
recomp-core = { path = "../recomp-core" }
jni-sys = "0.3.0"
libloading = "0.8"
sha1 = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
